name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  backend-tests:
    name: Backend pytest
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e "apps/api[dev,hierarchical]"
          # Belt-and-suspenders for deps not declared in pyproject.toml.
          pip install \
            "structlog>=24.0" "sentry-sdk[fastapi]>=2.0" "pyyaml>=6.0"

      - name: Run pytest
        run: |
          PYTHONPATH=$PWD pytest apps/api/tests/ -q --tb=short
        env:
          PYTHONUNBUFFERED: "1"

  frontend-typecheck:
    name: Frontend typecheck + lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm

      - run: npm ci
      - run: npm run typecheck:web
      - run: npm run lint:web

  playwright-smoke:
    name: Playwright smoke tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm

      - run: npm ci

      - name: Install Playwright browsers
        working-directory: apps/web
        run: npx playwright install --with-deps chromium

      - name: Build the Next app
        working-directory: apps/web
        run: npm run build

      - name: Run Playwright smoke tests
        working-directory: apps/web
        run: npm run test:e2e

      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: apps/web/playwright-report/
          retention-days: 7

  # Probe whether ANTHROPIC_API_KEY is set. We do this in its own job and expose the result
  # as an output so the agent-eval job below can gate on it via `needs`. Referencing
  # `secrets.X` directly in a job-level `if:` is rejected at workflow startup.
  check-anthropic-secret:
    name: Check ANTHROPIC_API_KEY presence
    runs-on: ubuntu-latest
    outputs:
      has-key: ${{ steps.check.outputs.has-key }}
    steps:
      - id: check
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          if [ -n "${ANTHROPIC_API_KEY}" ]; then
            echo "has-key=true" >> "$GITHUB_OUTPUT"
          else
            echo "has-key=false" >> "$GITHUB_OUTPUT"
          fi

  # Optional: multi-agent eval gate. Skipped when the repo doesn't have the secret
  # (e.g. fork PRs, or before the maintainer has provisioned it).
  agent-eval:
    name: Agent eval (LLM tasks)
    runs-on: ubuntu-latest
    needs: [check-anthropic-secret, backend-tests]
    if: ${{ needs.check-anthropic-secret.outputs.has-key == 'true' }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e "apps/api[dev,hierarchical]"
          pip install \
            "structlog>=24.0" "sentry-sdk[fastapi]>=2.0" "pyyaml>=6.0"

      - name: Create demo dataset and run agent eval
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          mkdir -p ./data/datasets
          PYTHONPATH=$PWD python -m uvicorn apps.api.main:app --port 8000 &
          SERVER_PID=$!
          for i in {1..30}; do
            if curl -sf http://localhost:8000/health > /dev/null; then break; fi
            sleep 1
          done
          DSID=$(curl -sS -X POST http://localhost:8000/datasets/demo/coffee_perishable \
                  | python -c "import json,sys;print(json.load(sys.stdin)['dataset_id'])")
          PYTHONPATH=$PWD python -m apps.api.llm.agent_eval \
            --dataset-id "$DSID" \
            --max 10 \
            --threshold-multi 0.75 \
            --threshold-single 0.9 \
            --no-judge
          kill $SERVER_PID || true
