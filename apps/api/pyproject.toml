[project]
name = "inventory-optimizer-api"
version = "0.1.0"
description = "Inventory optimizer FastAPI backend — ingestion, forecasting, inventory math, LLM tool-use chat."
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "pydantic>=2.7",
    "pydantic-settings>=2.4",
    "python-multipart>=0.0.9",
    "httpx>=0.27",

    # Data
    "pandas>=2.2",
    "numpy>=1.26,<2.0",
    "scipy>=1.13",
    "duckdb>=1.0",
    "openpyxl>=3.1",
    "pyarrow>=16",

    # Forecasting
    "statsforecast>=1.7",
    "lightgbm>=4.3",

    # LLM
    "anthropic>=0.34",

    # Misc
    "python-dotenv>=1.0",
    "slowapi>=0.1.9",
    "rich>=13.7",
]

[project.optional-dependencies]
foundation = [
    # Chronos-Bolt — pulled in for Phase 5 (day 8). Keep separable so days 1–7 don't need torch.
    "chronos-forecasting>=2.0",
    "torch>=2.2",
]
hierarchical = [
    "hierarchicalforecast>=0.4",
]
bayes = [
    # Cold-start Bayesian shrinkage. Optional — empirical-Bayes closed-form is the fast path.
    "numpyro>=0.15",
    "jax>=0.4",
]
jobs = [
    "arq>=0.26",
    "redis>=5.0",
]
dev = [
    "pytest>=8.2",
    "pytest-asyncio>=0.23",
    "pytest-cov>=5.0",
    "ruff>=0.5",
    "mypy>=1.10",
    "freezegun>=1.5",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["."]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "N", "W"]
ignore = ["E501"]  # let formatter handle line length

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
addopts = "-q --strict-markers"
