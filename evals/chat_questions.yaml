# Chat-layer eval harness — 20 golden questions.
#
# Run: python -m apps.api.llm.eval --dataset-id <id>
# CI threshold: 90% pass rate.
#
# Each test specifies:
# - id: short identifier
# - question: what the user asks
# - expect_tools: at least one of these tool names MUST appear in the trace (use list-of-lists for AND-of-ORs)
# - expect_text_contains_any: at least one of these strings must appear in assistant's final text (case-insensitive)
# - expect_no_tools: tool names that MUST NOT appear

questions:
  # --- Day 6 v1 questions (carried over) ---
  - id: portfolio-overview
    question: "How many SKUs are in this dataset and what's the total annual revenue?"
    expect_tools: ["get_aggregate_stats"]
    expect_text_contains_any: ["sku", "$", "revenue"]

  - id: top-revenue-skus
    question: "What are the top 5 SKUs by annual revenue?"
    expect_tools: ["query_skus"]
    expect_text_contains_any: ["sku-", "$", "top"]

  - id: forecast-single-sku
    question: "What's the demand forecast for SKU-00061 over the next 12 weeks?"
    expect_tools: ["get_forecast"]
    expect_text_contains_any: ["forecast", "week", "interval", "mape", "crps"]

  - id: reorder-recommendation
    question: "How much should I reorder for SKU-00061 at a 95% service level?"
    expect_tools: ["compute_reorder"]
    expect_text_contains_any: ["order", "reorder point", "safety", "stockout"]

  - id: scenario-lead-time-double
    question: "If lead times double for SKU-00061, how much extra safety stock do I need?"
    expect_tools: ["run_scenario"]
    expect_text_contains_any: ["safety stock", "lead time", "double"]

  - id: service-level-tradeoff
    question: "Compare 90% vs 99% service level for SKU-00061 — what's the cost difference?"
    expect_tools: ["run_scenario"]
    expect_text_contains_any: ["cost", "service level", "$"]

  - id: abc-class-filter
    question: "List my A-class SKUs."
    expect_tools: ["query_skus"]
    expect_text_contains_any: ["a-class", "abc", "sku-"]

  - id: dead-stock
    question: "Which SKUs have lots of inventory but low recent demand?"
    expect_tools: ["query_skus", "get_aggregate_stats", "analyze_dataframe"]
    expect_text_contains_any: ["sku", "demand", "inventory", "on hand", "on_hand"]

  - id: low-history-refusal
    question: "Forecast SKU-NONEXISTENT for the next 12 weeks."
    expect_tools: ["get_forecast", "get_sku_details"]  # either tool surfaces the missing SKU
    expect_text_contains_any: ["not", "no history", "doesn't exist", "found", "exist"]

  - id: portfolio-inventory-value
    question: "What's my total inventory value and average days of cover?"
    expect_tools: ["get_aggregate_stats"]
    expect_text_contains_any: ["$", "days", "cover", "inventory"]

  # --- Day 10 v2 questions ---
  - id: data-quality-overview
    question: "How clean is my data? Any issues I should know about?"
    expect_tools: ["get_data_quality_report"]
    expect_text_contains_any: ["score", "quality", "completeness", "plausibility"]

  - id: m5-comparison
    question: "Is SKU-00061's demand variability normal for retail, or unusually high?"
    expect_tools: ["compare_to_m5", "get_sku_details"]
    expect_text_contains_any: ["m5", "percentile", "cv", "compare", "normal", "typical"]

  - id: ad-hoc-analysis
    question: "Sum total demand by category and rank them."
    expect_tools: ["analyze_dataframe", "get_aggregate_stats"]
    expect_text_contains_any: ["category", "demand", "total", "sum"]

  - id: chart-distribution
    question: "Show me a chart of how many SKUs we have in each ABC class."
    expect_tools: ["make_chart", "get_aggregate_stats"]
    expect_text_contains_any: ["abc", "chart", "class"]

  - id: regime-break-warning
    question: "Are any of my SKUs unstable or have structural breaks?"
    expect_tools: ["get_data_quality_report"]
    expect_text_contains_any: ["regime", "break", "stationarity", "structural", "stable"]

  - id: top-stockout-risk
    question: "Which SKUs are most at risk of stocking out in the next month?"
    expect_tools: ["query_skus", "compute_reorder", "analyze_dataframe"]
    expect_text_contains_any: ["stockout", "risk", "sku"]

  - id: supplier-concentration
    question: "Which supplier do I rely on most by revenue?"
    expect_tools: ["analyze_dataframe", "query_skus", "get_aggregate_stats"]
    expect_text_contains_any: ["supplier", "revenue", "$"]

  - id: cold-start-skus
    question: "Do I have any SKUs with too little history to forecast confidently?"
    expect_tools: ["get_aggregate_stats", "get_data_quality_report"]
    expect_text_contains_any: ["history", "low", "cold", "observation", "shrinkage"]

  - id: forecast-uncertainty
    question: "What's the 95% prediction interval for SKU-00061 next week?"
    expect_tools: ["get_forecast"]
    expect_text_contains_any: ["95", "interval", "upper", "lower", "between"]

  - id: planning-question
    question: "I have $50,000 to spend on inventory this month. Which SKUs should I prioritize?"
    expect_tools: ["query_skus", "compute_reorder", "analyze_dataframe", "get_aggregate_stats", "plan_reorder_week"]
    expect_text_contains_any: ["$", "sku", "prioritize", "order", "abc"]

  - id: chart-demand-by-category
    question: "Show me total demand by category as a bar chart."
    expect_tools_all: ["analyze_dataframe", "make_chart"]
    expect_text_contains_any: ["category", "demand", "chart"]

  - id: chart-demand-over-time
    question: "Plot total weekly demand over time as a line chart."
    expect_tools_all: ["analyze_dataframe", "make_chart"]
    expect_text_contains_any: ["over time", "weekly", "trend", "demand", "line"]

  - id: plan-reorder-with-budget
    question: "Plan next week's reorders for me with a $30,000 budget cap."
    expect_tools: ["plan_reorder_week"]
    expect_text_contains_any: ["$", "sku", "budget", "deferred", "week"]
